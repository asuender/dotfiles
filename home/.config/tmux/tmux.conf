# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 10
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -g renumber-windows on
set -g focus-events on
set -g set-clipboard on
set -g extended-keys always

# Slow down scroll speed (1 line at a time)
set -g @scroll-speed-num-lines-per-scroll 1
bind -T copy-mode-vi WheelUpPane send -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N 1 -X scroll-down

# Pane controls
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Down resize-pane -D 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Right resize-pane -R 5

bind -n M-Home split-window -v -c "#{pane_current_path}"
bind -n M-End split-window -h -c "#{pane_current_path}"

# Window navigation
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5

bind -n M-n new-window -c "#{pane_current_path}" -n "shell"
bind -n M-m new-window -c "#{pane_current_path}" -n "nvim" "nvim ."
bind -n M-, new-window -c "#{pane_current_path}" -n "opencode" "opencode --port"
bind -n M-. new-window -c "#{pane_current_path}" -n "codex" "codex"
bind -n M-- new-window -c "#{pane_current_path}" -n "pi" "pi"
bind -n M-l run-shell "~/.local/bin/helpers/tmux-dev-threesome codex"
bind -n M-w run-shell "~/.local/bin/helpers/tmux-dev codex"
bind -n M-L kill-window

bind -n M-d if-shell -F '#{==:#{session_name},default}' 'switch-client -l' 'switch-client -t default'
bind -n M-o switch-client -l
bind -n M-j display-popup -E "tms"
bind -n M-s display-popup -E "tms switch"
bind -n M-c display-popup -E -h 30% -w 70% -T "Clone repository" "~/.local/bin/helpers/tmux-clone"

# Optional; I've also put an alias for this inside ~/.zshrc
bind -n C-L clear-history

# The following keeps the prefix for
# destructive and rare actions
bind -n M-r command-prompt -I "#W" -p "Rename active window to:" "rename-window '%%'"
bind -n M-R command-prompt -I "#S" -p "Rename active session to:" "rename-session '%%'"
bind x confirm-before -p "Kill window #W? (y/n)" kill-window
bind X confirm -p "Kill current session? (y/N):" "run-shell 'tms kill'"

# reload config file
bind , source-file ~/.config/tmux/tmux.conf

# Status line
set -g status-position top
set -g status 2
set -g status-format[1] "#[bg=default]"
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""

# Theme configuration
set -g @tmux-dotbar-bg "#24273a"
set -g @tmux-dotbar-fg "#6e738d"
set -g @tmux-dotbar-fg-current "#cad3f5"
set -g @tmux-dotbar-fg-session "#8aadf4"
set -g @tmux-dotbar-fg-prefix "#f5a97f"
set -g @tmux-dotbar-position "top"
set -g @tmux-dotbar-justify "left"
set -g @tmux-dotbar-right "false"
set -g @tmux-dotbar-bold-session "true"
set -g @tmux-dotbar-bold-current-window "true"
set -g @tmux-dotbar-session-text " #S "
set -g @tmux-dotbar-window-status-separator "•"
set -g @tmux-dotbar-rounded true
set -g pane-border-style "fg=#5b6078"
set -g pane-active-border-style "fg=#c6a0f6"
set -g message-style "bg=#24273a,fg=#f5a97f"
set -g message-command-style "bg=#24273a,fg=#f5a97f"
set -g mode-style "bg=#8aadf4,fg=#24273a"
setw -g clock-mode-colour "#8aadf4"

run ~/.config/tmux/plugins/tmux-dotbar/dotbar.tmux
