[dotfiles]
"~/.agents" = { source = ".agents", mode = "symlink-each" }
"~/.config" = { source = ".config", mode = "symlink-each" }
"~/.hammerspoon" = { source = ".hammerspoon", mode = "symlink-each" }
"~/.oh-my-zsh" = { source = ".oh-my-zsh", mode = "symlink-each" }
"~/.pi" = { source = ".pi", mode = "symlink-each", exclude = ["agent/extensions/node_modules"] }
"~/.shell" = { source = ".shell", mode = "symlink-each" }
"~/.templates" = { source = ".templates", mode = "symlink-each" }
